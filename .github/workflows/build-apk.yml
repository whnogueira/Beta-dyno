name: Build Dyno Lite APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify project structure
        run: |
          test -f settings.gradle.kts || (echo "settings.gradle.kts not found" && exit 1)
          test -f build.gradle.kts || (echo "build.gradle.kts not found" && exit 1)
          test -f gradle/wrapper/gradle-wrapper.properties || (echo "gradle/wrapper/gradle-wrapper.properties not found" && exit 1)
          test -d app || (echo "app directory not found" && exit 1)

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          validate-wrappers: false

      - name: Display Gradle version
        run: gradle --version

      - name: Build Debug APK
        run: gradle clean assembleDebug --stacktrace --warning-mode all

      - name: Verify APK output
        run: |
          ls -la app/build/outputs/apk/debug/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dyno-Lite-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
